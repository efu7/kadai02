<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR課題2 - Eggplant</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: min(94%, 500px);
            padding: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 12px;
            text-align: center;
        }

        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        button {
            padding: 10px 12px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 7px;
            background: #fff;
        }

        button:active {
            background: #ddd;
        }

        #status {
            font-size: 12px;
            margin-top: 8px;
            color: #444;
        }
    </style>
</head>

<body>


    <a-scene embedded renderer="colorManagement: true;" arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">


        <a-marker preset="hiro">


            <a-entity id="model" gltf-model="./Eggplant.glb" position="0 0 1" rotation="-90 0 0" scale="0.5 0.5 0.5">
            </a-entity>
        </a-marker>


        <a-entity camera></a-entity>

    </a-scene>


    <div id="controls">
        <div class="button-row">
            <button id="zoomIn">拡大 ＋</button>
            <button id="zoomOut">縮小 －</button>
            <button id="rotateLeft">左回転 ↶</button>
            <button id="rotateRight">右回転 ↷</button>
        </div>


    </div>

    <script>
        const model = document.getElementById("model");
        const status = document.getElementById("status");


        let scaleValue = 0.5;
        let rotationY = 180;




        document.getElementById("zoomIn")
            .addEventListener("click", function () {
                scaleValue = Math.min(scaleValue + 0.1, 3);

                model.setAttribute("scale", {
                    x: scaleValue,
                    y: scaleValue,
                    z: scaleValue
                });
            });


        document.getElementById("zoomOut")
            .addEventListener("click", function () {
                scaleValue = Math.max(scaleValue - 0.1, 0.1);

                model.setAttribute("scale", {
                    x: scaleValue,
                    y: scaleValue,
                    z: scaleValue
                });
            });


        document.getElementById("rotateLeft")
            .addEventListener("click", function () {
                rotationY -= 15;

                model.setAttribute("rotation", {
                    x: 0,
                    y: rotationY,
                    z: 0
                });
            });


        document.getElementById("rotateRight")
            .addEventListener("click", function () {
                rotationY += 15;

                model.setAttribute("rotation", {
                    x: 0,
                    y: rotationY,
                    z: 0
                });
            });
    </script>

</body>

</html>
